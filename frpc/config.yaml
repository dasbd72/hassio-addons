name: "FRP Client"
version: "0.1.5"
slug: "frpc"
description: "Runs frpc to expose local services through an frp server"
url: https://github.com/dasbd72/hassio-addons/tree/main/frpc
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
options:
  server_addr: ""
  server_port: 7000
  token: ""
  proxies: []
schema:
  server_addr: str
  server_port: port
  token: password
  proxies:
    - name: str
      type: list(http|tcp|udp)
      local_ip: str
      local_port: port
      remote_port: port?
      custom_domains:
        - str
